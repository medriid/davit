# Builds the desktop app on each system from the tagged commit and adds the installers to the
# release, once release.yml has made it. Run by hand, it only builds and keeps them as artifacts.
#
# The captcha weights and the slot table aren't in the repository; they come from Actions
# secrets, set with tools/release-secrets.sh.
name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: desktop-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis,msi
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe desktop/src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
            files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            files: desktop/src-tauri/target/release/bundle/deb/*.deb desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^ *"version": "\(.*\)",/\1/p' desktop/src-tauri/tauri.conf.json | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag is $GITHUB_REF_NAME but the desktop version is $v"; exit 1; }

      - name: Private files
        env:
          P1: ${{ secrets.DAVIT_PRIVATE_1 }}
          P2: ${{ secrets.DAVIT_PRIVATE_2 }}
          P3: ${{ secrets.DAVIT_PRIVATE_3 }}
          P4: ${{ secrets.DAVIT_PRIVATE_4 }}
          P5: ${{ secrets.DAVIT_PRIVATE_5 }}
          P6: ${{ secrets.DAVIT_PRIVATE_6 }}
        run: |
          [ -n "$P1" ] || { echo "::error::Release secrets are missing; run tools/release-secrets.sh"; exit 1; }
          printf '%s' "$P1$P2$P3$P4$P5$P6" | base64 -d | tar -xz

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --locked

      # With the signing key, each build also makes what "update by itself" installs. Without it
      # the installers are the same, and the app says when a new version is out.
      - name: Build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build ${{ matrix.args }}
          fi

      - name: Keep the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: davit-${{ matrix.os }}
          path: desktop/src-tauri/target/**/release/bundle/*/*.*
          if-no-files-found: error

      - name: Add them to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            sleep 20
          done
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber

      - name: Keep what the updater needs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: updater-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/nsis/*.sig
            desktop/src-tauri/target/**/release/bundle/macos/*.tar.gz
            desktop/src-tauri/target/**/release/bundle/macos/*.sig
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/appimage/*.sig
          if-no-files-found: ignore

  # What a running app checks. Skipped until the signing key is set: nothing to point at.
  updater:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: updater-*
          path: artifacts
      - name: latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["REPO"]
          def entry(pattern):
              for sig in glob.glob(f"artifacts/**/{pattern}.sig", recursive=True):
                  name = os.path.basename(sig)[:-4]
                  return {"signature": open(sig).read().strip(), "url": f"https://github.com/{repo}/releases/download/{tag}/{name}"}
          win, mac, linux = entry("*-setup.exe"), entry("*.app.tar.gz"), entry("*.AppImage")
          platforms = {}
          if win: platforms["windows-x86_64"] = win
          if mac: platforms["darwin-x86_64"] = platforms["darwin-aarch64"] = mac
          if linux: platforms["linux-x86_64"] = linux
          if not platforms:
              print("No signed builds, so no latest.json.")
              sys.exit(0)
          json.dump({"version": tag.lstrip("v"), "platforms": platforms}, open("latest.json", "w"))
          PY
          if [ -f latest.json ]; then
            files=$(find artifacts -type f \( -name '*.app.tar.gz' -o -name '*.sig' \))
            gh release upload "$GITHUB_REF_NAME" latest.json $files --clobber --repo "$REPO"
          fi
