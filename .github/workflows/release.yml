# Builds the signed APK from the tagged commit and publishes it as a GitHub release.
# Push a tag matching android/app/build.gradle.kts's versionName (v0.6.0 for "0.6.0").
# Run by hand, it only builds and keeps the APK as a workflow artifact.
#
# The captcha weights, the slot table and the signing key aren't in the repository; they
# come from Actions secrets, set with tools/release-secrets.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Same certificate as every earlier release, or phones refuse to update over it.
      CERT_SHA256: 07e0ba993bb9a5b15983ac2812d87c48a54bcb5465e83c3c835015748d29daa5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag is $GITHUB_REF_NAME but versionName is $v"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Private files and signing key
        env:
          P1: ${{ secrets.DAVIT_PRIVATE_1 }}
          P2: ${{ secrets.DAVIT_PRIVATE_2 }}
          P3: ${{ secrets.DAVIT_PRIVATE_3 }}
          P4: ${{ secrets.DAVIT_PRIVATE_4 }}
          P5: ${{ secrets.DAVIT_PRIVATE_5 }}
          P6: ${{ secrets.DAVIT_PRIVATE_6 }}
          KEYSTORE: ${{ secrets.DAVIT_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.DAVIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAVIT_KEY_ALIAS }}
        run: |
          [ -n "$P1" ] && [ -n "$KEYSTORE" ] || { echo "::error::Release secrets are missing; run tools/release-secrets.sh"; exit 1; }
          printf '%s' "$P1$P2$P3$P4$P5$P6" | base64 -d | tar -xz
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/release.pass"
          printf 'storeFile=%s\npasswordFile=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.pass" "$KEY_ALIAS" > android/keystore.properties

      - name: Build
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'dev/medriid/davit/vtop/captcha_model.bin' || { echo "::error::The captcha model isn't in the APK"; exit 1; }
          unzip -l "$apk" | grep -q 'dev/medriid/davit/vtop/slot_times.txt' || { echo "::error::The slot table isn't in the APK"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -q "SHA-256 digest: $CERT_SHA256" || { echo "::error::The APK isn't signed with the release key"; exit 1; }
          v=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          cp "$apk" "davit-$v.apk"
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Keep the APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: davit-${{ env.VERSION }}
          path: davit-${{ env.VERSION }}.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
            echo
            echo "Android 8+. Already have daVIT? It downloads this by itself and asks you to install it (Settings → About)."
            echo "On OnePlus, Oppo, Realme and Xiaomi phones, allow daVIT to run in the background (Settings → Sync) so syncs and alerts arrive."
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "davit-$VERSION.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "davit-$VERSION.apk" --title "daVIT $VERSION" --notes-file notes.md --verify-tag
          fi
