<!-- Hand-written fixture: what StudentBonafideOnChange renders for code 3 (vacation visa), with the page's script that fixes the dates. -->
<div id="main-section"><h3 class="box-title">Bonafide Application - Student</h3>
<form role="form" id="studentBonafide" name="studentBonafide" method="post" autocomplete="off">
<input type="hidden" name="_csrf" value="CSRF" /><input type="hidden" name="authorizedID" id="authorizedID" value="REGNO" />
<label for="acadYear">Select Service<span> *</span></label>
<select class="form-control" name="certificateCode" id="certificateCode" onchange="bonafideStudentOnChange(this.value);">
<option value="">-- Choose Service --</option><option value="1">PASSPORT</option><option value="3" selected="selected">VISA (FOR VACATION)</option></select>
<div id="table-responsive"><table class="table table-bordered">
<tr><td colspan="4">Bonafide Application(All fields are mandatory)</td></tr>
<tr><td>From Date <span>*</span></td><td><div class="input-group date" id="datetimepicker3"><input type="text" class="form-control" name="fromDate" id="fromDate" /></div></td></tr>
<tr><td>To Date <span>*</span></td><td><div class="input-group date" id="datetimepicker4"><input type="text" class="form-control" name="toDate" id="toDate" /></div></td></tr>
<tr><td>Enter Visa Place <span>*</span></td><td><input type="text" class="form-control" name="visaPlace" id="visaPlace" /></td></tr>
<tr><td>Description (about certificate which you are applying..) <span>*</span></td><td><textarea rows="5" cols="5" class="form-control" name="description" id="description"></textarea><br /><span id="charsRemain"></span></td></tr>
<tr><td colspan="4" align="center"><button type="button" name="action" onclick="bonafideApplicationSave();" class="btn btn-primary">Apply</button></td></tr>
</table></div></form></div>
<script>
function bonafideStudentOnChange(code) { $.ajax({ url : "others/bonafide/StudentBonafideOnChange", success : function(response) { $("#main-section").html(response);
  if (parseInt(code) == 3 || parseInt(code) == 16 || parseInt(code) == 43) { document.getElementById("fromDate").value = "20-Dec-2026"; document.getElementById("toDate").value = "03-Jan-2027";
  document.getElementById("fromDate").readOnly = true; document.getElementById("toDate").readOnly = true; } } }); }
</script>
